    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "name": "Douglas Candido",
            "url": "https://douglazcandido.com/",
            "jobTitle": "Data and Software Engineer",
            "sameAs": [
              "https://github.com/douglazcandido",
              "https://www.linkedin.com/in/douglazcandido/"
            ],
            "knowsAbout": [
              "Data engineering",
              "Backend development",

              "AWS",
              "PostgreSQL",
              "Python"
            ]
          },
          {
            "@type": "WebSite",
            "name": "Douglas Candido",
            "alternateName": ["douglazcandido.com"],
            "url": "https://douglazcandido.com/",
            "inLanguage": "en"
          }
        ]
      }
    </script>

    <script>
      // Runs before the first paint. The flag below is filled in at build time from src/config/theme.ts
      // (DARK-THEME-DISABLED: false -> always light; a saved "dark" is ignored and removed).
      (function () {
        var darkEnabled = __DARK_THEME_ENABLED__;
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem("theme");
          if (!darkEnabled) {
            if (stored === "dark") localStorage.removeItem("theme");
          } else if (stored && stored !== "light") {
            root.removeAttribute("data-theme"); // dark is the CSS default; light is the default, whatever the OS prefers
            return;
          }
        } catch (e) {}
        root.setAttribute("data-theme", "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
